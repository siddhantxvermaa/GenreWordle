<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genre Wordle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="home-screen">
        <h1 class="title">WORDLE</h1>
        <div class="profile-input-container">
            <input type="text" id="player-name-input" placeholder="Enter your name" maxlength="15">
        </div>
        <div class="mode-select-container">
            <label for="home-mode-selector">Select Mode:</label>
            <select id="home-mode-selector">
                <option value="genre">Genre Mode</option>
                <option value="classic">Classic Mode</option>
            </select>
        </div>
        <button id="start-game-btn">Play Game</button>
        <button id="leaderboard-btn" class="secondary-btn">Leaderboard</button>
    </div>

    <div id="game-ui" class="hidden">
        <header>
            <div class="header-title-row">
            <h1>WORDLE</h1>
            <button id="report-btn" class="icon-btn" title="Report a Glitch">🐛 Report Glitch</button>
        </div>
            <div id="header-stats">
                <span id="player-name-display">Player</span>: <span id="player-score-display">0</span> pts
            </div>
            <div id="genre-display">Genre: <span id="current-genre">Loading...</span></div>
        </header>

        <main>
            <div id="game-board"></div>
            <div id="message-container"></div>
        </main>

        <div id="keyboard-container">
            <div class="keyboard-row">
                <button data-key="Q">Q</button>
                <button data-key="W">W</button>
                <button data-key="E">E</button>
                <button data-key="R">R</button>
                <button data-key="T">T</button>
                <button data-key="Y">Y</button>
                <button data-key="U">U</button>
                <button data-key="I">I</button>
                <button data-key="O">O</button>
                <button data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <div class="spacer"></div>
                <button data-key="A">A</button>
                <button data-key="S">S</button>
                <button data-key="D">D</button>
                <button data-key="F">F</button>
                <button data-key="G">G</button>
                <button data-key="H">H</button>
                <button data-key="J">J</button>
                <button data-key="K">K</button>
                <button data-key="L">L</button>
                <div class="spacer"></div>
            </div>
            <div class="keyboard-row">
                <button data-key="ENTER" class="wide-button">ENTER</button>
                <button data-key="Z">Z</button>
                <button data-key="X">X</button>
                <button data-key="C">C</button>
                <button data-key="V">V</button>
                <button data-key="B">B</button>
                <button data-key="N">N</button>
                <button data-key="M">M</button>
                <button data-key="BACKSPACE" class="wide-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
                        <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for end game -->
    <div id="end-modal" class="hidden modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <button id="play-again-btn">Play Next Word</button>
            <button id="end-home-btn" class="secondary-btn">Home</button>
        </div>
    </div>

    <!-- Modal for Leaderboard -->
    <div id="leaderboard-modal" class="hidden modal-overlay">
        <div class="modal-content leaderboard-content">
            <h2>Leaderboard</h2>
            <ul id="leaderboard-list"></ul>
            <button id="close-leaderboard-btn">Close</button>
        </div>
    </div>

    <!-- Modal for Bug Report -->
    <div id="report-modal" class="hidden modal-overlay">
        <div class="modal-content report-content">
            <h2>Report a Glitch</h2>
            <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #a0a0a5;">Found a bug? Describe it below and it will be sent directly to the developer.</p>
            <textarea id="bug-description" rows="4" placeholder="E.g., The game froze when I typed a word..."></textarea>
            <div style="display: flex; gap: 10px; margin-top: 1rem;">
                <button id="submit-report-btn">Send Report</button>
                <button id="close-report-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Version Number -->
    <div id="version-number">v1.1</div>

    <script src="main.js"></script>
</body>
</html>
